<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — Pocketlog</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc; color: #334155; text-align: center; padding: 24px;
    }
    .logo { height: 56px; width: 56px; border-radius: 16px; background: #4f46e5; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    h1 { font-size: 18px; margin: 0 0 6px; color: #0f172a; }
    p { font-size: 14px; color: #64748b; max-width: 280px; margin: 0 0 20px; }
    button { background: #4f46e5; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>Pocketlog needs a connection to load your data. Check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
